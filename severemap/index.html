<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Severe Watch Map</title>
<link rel="stylesheet" href="/vendor/maplibre-gl@6.14.0/dist/maplibre-gl.css">
<script src="/vendor/pmtiles@4.5.0/dist/pmtiles.js"></script>
<style>
  :root {
    --ink: #1d232b; --muted: #5d6570; --line: #e3e0da; --card: #ffffffee; --chip: #f1efeb; --chip-on: #1d232b;
    --storms: #e4572e; --rain: #2b7bd6; --wind: #7b4fd1; --fire: #d99a00; --heat: #a3123a;
    --frost: #1fa99c; --snow: #6aa6dc; --tc: #c2185b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #d9e8f2; color: var(--ink);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #map { position: absolute; inset: 0; }
  #panel { position: absolute; top: 12px; left: 12px; bottom: 12px; width: 340px; display: flex; flex-direction: column;
    background: var(--card); backdrop-filter: blur(6px); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 6px 24px #0002; overflow: hidden; z-index: 2; }
  header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 16px; margin: 0 0 2px; }
  .run { color: var(--muted); font-size: 12.5px; }
  .days, .chips { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .days button, .chips button { border: 0; border-radius: 999px; padding: 5px 11px; background: var(--chip); color: var(--ink);
    font: inherit; font-size: 13px; cursor: pointer; }
  .chips button { padding: 4px 9px; font-size: 12.5px; }
  .days button[aria-pressed="true"], .chips button[aria-pressed="true"] { background: var(--chip-on); color: #fff; }
  ol { list-style: none; margin: 0; padding: 6px 0; overflow-y: auto; flex: 1; }
  li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; padding: 8px 16px; cursor: pointer; align-items: start; }
  li:hover, li.on { background: #0000000a; }
  li.off { opacity: .35; }
  li .h { font-weight: 600; }
  li .s { color: var(--muted); font-size: 12.5px; }
  .sep { padding: 10px 16px 2px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; cursor: default; display: block; }
  .badge { width: 24px; height: 24px; border-radius: 50%; color: #fff; font-weight: 700; font-size: 12.5px;
    display: grid; place-items: center; border: 2px solid #fff; box-shadow: 0 1px 4px #0005; }
  .badge.small { width: 14px; height: 14px; margin: 5px; border-width: 2px; }
  .marker { cursor: pointer; }
  .empty { padding: 16px; color: var(--muted); }
  footer { padding: 8px 16px 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11.5px; }
  #layers { position: absolute; top: 12px; right: 52px; width: 300px; z-index: 2; background: var(--card);
    backdrop-filter: blur(6px); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 6px 24px #0002;
    padding: 10px 12px; }
  #layers .t { font-weight: 600; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
  #layers .chips { margin-top: 8px; }
  #layers .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; font-size: 12.5px; color: var(--muted); }
  #layers select { font: inherit; font-size: 12.5px; padding: 3px 4px; border-radius: 6px; border: 1px solid var(--line); background: #fff; flex: 1; }
  #layers input[type=range] { flex: 1; }
  #legend { margin-top: 8px; display: none; }
  #legend canvas { width: 100%; height: 10px; border-radius: 3px; display: block; border: 1px solid #0001; }
  #legend .tk { position: relative; height: 14px; font-size: 10.5px; color: var(--muted); }
  #legend .tk span { position: absolute; transform: translateX(-50%); }
  #status { font-size: 12px; color: var(--muted); margin-top: 6px; min-height: 1em; }
  #probe { position: absolute; pointer-events: none; z-index: 3; background: #1d232be6; color: #fff; font-size: 12px;
    padding: 3px 7px; border-radius: 6px; display: none; white-space: nowrap; }
  .maplibregl-popup-content { font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 10px 12px; }
  .maplibregl-popup-content b { display: block; margin-bottom: 2px; }
  .maplibregl-popup-content a.post { display: inline-block; margin-top: 8px; padding: 5px 10px; border-radius: 6px;
    background: var(--chip-on); color: #fff; text-decoration: none; font-weight: 600; font-size: 12.5px; }
  .maplibregl-popup-content a.post[aria-disabled] { opacity: .5; pointer-events: none; }
  @media (max-width: 700px) {
    #panel { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; max-height: 45vh; }
    #layers { left: 8px; right: 52px; width: auto; top: 8px; }
  }
</style>
</head>
<body>
<div id="map"></div>
<aside id="panel">
  <header>
    <h1>3-day severe watch</h1>
    <div class="run" id="run">Loading…</div>
    <div class="days" id="days"></div>
  </header>
  <ol id="list"></ol>
  <footer>Automatic detection from the raw model run. Not a forecast. Nothing here has gone to members.</footer>
</aside>
<section id="layers" aria-label="Model overlays">
  <div class="t"><span>Model overlay</span><span id="mrun" class="run"></span></div>
  <div class="chips" id="fields"></div>
  <div class="row"><select id="when" aria-label="Overlay time"></select></div>
  <div class="row"><span>Strength</span><input id="op" type="range" min="0.15" max="1" step="0.05" value="0.65" aria-label="Overlay strength"></div>
  <div id="legend"><canvas id="lg" width="256" height="1"></canvas><div class="tk" id="ticks"></div></div>
  <div id="status"></div>
</section>
<div id="probe"></div>
<script type="module">
import * as maplibregl from '/vendor/maplibre-gl@6.14.0/dist/maplibre-gl.mjs';

// The morning email's link carries the areas after '#' (pipeline/morning_email.py map_link); nothing
// after '#' ever reaches a server. "#1." = the outlook's 0.72 deg boxes (links before 20 Nov 2026);
// "#2." = drawn outlines (fine_areas.py): i: [[n, family, level, headline, when, day bits, outer, inner, seed]...],
// rings packed as hundredths of a degree, [lon0, lat0, dlon, dlat, ...]. n is the item's number in the
// email, 0 for areas listed only as "also on the map".
const TIER = { 1: 'Minor', 2: 'Moderate', 3: 'Significant', 4: 'Major' };
const FILL = { 1: 0.24, 2: 0.34, 3: 0.44, 4: 0.54 };
const css = getComputedStyle(document.documentElement);
const colour = (fam) => css.getPropertyValue('--' + fam).trim() || '#888';
const KEY = 'severe-watch-last';

async function decode(hash) {
  const m = /^#([12])\.([A-Za-z0-9_-]+)$/.exec(hash);
  if (!m) return null;
  const bin = atob(m[2].replace(/-/g, '+').replace(/_/g, '/'));
  const bytes = Uint8Array.from(bin, (c) => c.charCodeAt(0));
  const text = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
  return JSON.parse(text);
}

async function load() {
  let data = null, hash = location.hash;
  try { data = await decode(hash); } catch (e) { console.error('bad map link', e); }
  try {
    if (data) localStorage.setItem(KEY, hash);
    else if ((hash = localStorage.getItem(KEY))) data = await decode(hash);
  } catch { /* storage blocked: the link still works */ }
  return data;
}

const unpack = (rings) => (rings || []).map((flat) => {
  const out = [];
  let x = 0, y = 0;
  for (let i = 0; i < flat.length; i += 2) { x += flat[i]; y += flat[i + 1]; out.push([x / 100, y / 100]); }
  out.push(out[0]);
  return out;
});

maplibregl.setWorkerUrl('/vendor/maplibre-gl@6.14.0/dist/maplibre-gl-worker.mjs');
maplibregl.addProtocol('pmtiles', new pmtiles.Protocol().tile);
const data = await load();
const styleText = await (await fetch('/basemap-style.json')).text();
const style = JSON.parse(styleText.replaceAll('__ORIGIN__', location.origin + '/tiles'));

const map = new maplibregl.Map({
  container: 'map', style, bounds: [[112, -44], [154, -10]],
  fitBoundsOptions: { padding: pad() }, attributionControl: { compact: true }, dragRotate: false, pitchWithRotate: false,
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');
map.touchZoomRotate.disableRotation();

function pad() {
  const narrow = innerWidth <= 700;
  return narrow ? { top: 40, right: 40, bottom: innerHeight * 0.47, left: 40 } : { top: 40, right: 360, bottom: 40, left: 380 };
}

const V2 = data?.v === 2;
const days = data?.days || [];
const half = (data?.step || 0.72) / 2;
const items = (data?.i || []).map((row, k) => {
  if (V2) {
    const [n, fam, level, head, when, bits, outer, inner, seed] = row;
    return { k, n, fam, level, head, when, bits, outer: unpack(outer), inner: unpack(inner), packed: { outer, inner }, seed };
  }
  const [n, fam, level, head, when, pts, seed] = row;
  return { k, n, fam, level, head, when, pts, seed };
});
let day = -1; // -1 = all three days
let markers = [];

document.getElementById('run').textContent = data
  ? `${days[0] || ''} to ${days[days.length - 1] || ''} · from the ${data.run} run`
  : 'Open this from the map link in the morning email.';

const showsOn = (it) => day < 0 || (V2 ? (it.bits >> day) & 1 : it.pts.some(([, , m]) => (m >> day) & 1));
const cells = (it) => it.pts.filter(([, , m]) => day < 0 || (m >> day) & 1);
const ringArea = (r) => { let a = 0; for (let i = 0; i < r.length - 1; i++) a += r[i][0] * r[i + 1][1] - r[i + 1][0] * r[i][1]; return Math.abs(a / 2); };

function geojson() {
  const features = [];
  for (const it of [...items].reverse()) { // the email's order, drawn so number 1 ends up on top
    if (!showsOn(it)) continue;
    const base = { k: it.k, c: colour(it.fam), main: it.n ? 1 : 0 };
    if (V2) {
      if (it.outer.length) features.push({ type: 'Feature', properties: { ...base, o: it.n ? FILL[it.level] : 0.14, w: it.n ? (it.level >= 3 ? 2.4 : 1.8) : 1, part: 'outer' },
        geometry: { type: 'MultiPolygon', coordinates: it.outer.map((r) => [r]) } });
      if (it.inner.length) features.push({ type: 'Feature', properties: { ...base, o: it.n ? 0.32 : 0.14, w: 2.2, part: 'inner' },
        geometry: { type: 'MultiPolygon', coordinates: it.inner.map((r) => [r]) } });
      continue;
    }
    for (const [lat, lon] of cells(it)) {
      features.push({
        type: 'Feature', properties: { ...base, o: it.n ? FILL[it.level] : 0.16, w: it.n && it.level >= 3 ? 1.6 : 0.6, part: 'outer' },
        geometry: { type: 'Polygon', coordinates: [[[lon - half, lat - half], [lon + half, lat - half], [lon + half, lat + half], [lon - half, lat + half], [lon - half, lat - half]]] },
      });
    }
  }
  return { type: 'FeatureCollection', features };
}

function anchorOf(it) {
  // the badge sits at the middle of the item's biggest outline (its first vertex if the middle falls outside)
  if (V2) {
    const r = [...it.outer].sort((a, b) => ringArea(b) - ringArea(a))[0];
    if (!r) return null;
    let x = 0, y = 0;
    for (const p of r.slice(0, -1)) { x += p[0]; y += p[1]; }
    return { at: [x / (r.length - 1), y / (r.length - 1)], small: ringArea(r) < 1.2, top: Math.max(...r.map((p) => p[1])) };
  }
  const pts = cells(it).length ? cells(it) : it.pts;
  let lat = 0, lon = 0;
  for (const p of pts) { lat += p[0]; lon += p[1]; }
  return { at: [lon / pts.length, lat / pts.length], small: pts.length <= 3, top: Math.max(...pts.map((p) => p[0])) + half };
}

function bounds(it) {
  const b = new maplibregl.LngLatBounds();
  if (V2) it.outer.forEach((r) => r.forEach((p) => b.extend(p)));
  else (cells(it).length ? cells(it) : it.pts).forEach(([lat, lon]) => b.extend([lon - half, lat - half]).extend([lon + half, lat + half]));
  return b;
}

// "Add to Post Alert drafts": the website's /post-alert page reads this seed after the '#', saves it
// as a draft and opens it (cyclonesoz repo, src/lib/alertSeed.js). The seed is the email's, rebuilt
// here from the outlines so the map link does not carry every area twice.
const POST_ALERT = 'https://cyclonesoz.com.au/post-alert';
async function postAlertLink(it) {
  const seed = V2 ? { v: 2, ...it.seed, outer: it.packed.outer, inner: it.packed.inner }
    : { v: 1, ...it.seed, step: data.step, cells: it.pts.map(([lat, lon, , inner]) => [lat, lon, inner ? 1 : 0]) };
  const stream = new Blob([JSON.stringify(seed)]).stream().pipeThrough(new CompressionStream('deflate-raw'));
  const bytes = new Uint8Array(await new Response(stream).arrayBuffer());
  let bin = '';
  for (const b of bytes) bin += String.fromCharCode(b);
  return `${POST_ALERT}#seed=1.${btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '')}`;
}

function popupBody(it) {
  const el = document.createElement('div');
  const b = document.createElement('b');
  b.textContent = (it.n ? it.n + '. ' : '') + it.head;
  el.append(b, `${it.when} · ${TIER[it.level]}`);
  if (it.seed) {
    const a = document.createElement('a');
    a.className = 'post';
    a.target = '_blank';
    a.rel = 'noopener';
    a.textContent = 'Add to Post Alert drafts';
    a.setAttribute('aria-disabled', 'true');
    // Built before the click, so the new tab is not blocked as a pop-up opened after an await.
    postAlertLink(it).then((url) => { a.href = url; a.removeAttribute('aria-disabled'); });
    el.append(a);
  }
  return el;
}

const popup = new maplibregl.Popup({ closeButton: false, maxWidth: '280px', offset: 14 });
function show(it, at) {
  popup.setLngLat(at || anchorOf(it)?.at || bounds(it).getCenter()).setDOMContent(popupBody(it)).addTo(map);
  document.querySelectorAll('li[data-k]').forEach((li) => li.classList.toggle('on', +li.dataset.k === it.k));
}

function draw() {
  map.getSource('areas')?.setData(geojson());
  markers.forEach((m) => m.remove());
  markers = [];
  for (const it of items) {
    const on = showsOn(it);
    document.querySelector(`li[data-k="${it.k}"]`)?.classList.toggle('off', !on);
    const a = on && anchorOf(it);
    if (!a) continue;
    const el = document.createElement('div');
    el.className = 'marker';
    el.innerHTML = `<div class="badge${it.n ? '' : ' small'}" style="background:${colour(it.fam)}">${it.n || ''}</div>`;
    el.addEventListener('click', (e) => { e.stopPropagation(); show(it); });
    // A badge would cover a small area, so those get it just above.
    markers.push(new maplibregl.Marker({ element: el, anchor: a.small ? 'bottom' : 'center', offset: a.small ? [0, -2] : [0, 0] })
      .setLngLat(a.small ? [a.at[0], a.top] : a.at).addTo(map));
  }
}

function list() {
  const ol = document.getElementById('list');
  if (!data) { ol.innerHTML = '<div class="empty">No areas loaded. The link in each morning email opens this map with that morning\'s areas.</div>'; return; }
  if (!items.length) { ol.innerHTML = '<div class="empty">Nothing in the next 3 days reaches an SWPA threshold.</div>'; return; }
  const row = (it) => {
    const li = document.createElement('li');
    li.dataset.k = it.k;
    li.innerHTML = `<div class="badge${it.n ? '' : ' small'}" style="background:${colour(it.fam)}">${it.n || ''}</div>
      <div><div class="h"></div><div class="s"></div></div>`;
    li.querySelector('.h').textContent = it.head;
    li.querySelector('.s').textContent = `${it.when} · ${TIER[it.level]}`;
    li.addEventListener('click', () => {
      map.fitBounds(bounds(it), { padding: pad(), maxZoom: 7, duration: 600 });
      show(it);
    });
    return li;
  };
  const main = items.filter((it) => it.n), rest = items.filter((it) => !it.n);
  main.forEach((it) => ol.append(row(it)));
  if (rest.length) {
    const s = document.createElement('li');
    s.className = 'sep';
    s.textContent = 'Also on the map';
    ol.append(s);
    rest.forEach((it) => ol.append(row(it)));
  }
}

function dayButtons() {
  const wrap = document.getElementById('days');
  if (!data) return;
  ['All 3 days', ...days].forEach((label, i) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.setAttribute('aria-pressed', String(i - 1 === day));
    b.addEventListener('click', () => {
      day = i - 1;
      wrap.querySelectorAll('button').forEach((x, j) => x.setAttribute('aria-pressed', String(j - 1 === day)));
      popup.remove();
      draw();
      if (ov.field && ov.whenFollowsDay) { whenSel.value = day < 0 ? defaultWhen() : 'd' + day; paintOverlay(); }
    });
    wrap.append(b);
  });
}

// --------------------------------------------------------------------------- model overlays
// Josh, 20 Nov 2026: "have certain model overlays on the map too like PWAT, total rain, temp, wind,
// wind shear, cape, scp, stp and ship like what you do on the outlook editor". The model viewer's
// frames (16-bit PNG: value = q * scale + offset, 65535 = none) through this map's own server, which
// holds the gate key. Colours are the viewer's own (src/components/modelViewer/palettes.js, exported

  whenSel.innerHTML = '';
  if (acc) whenSel.append(new Option('All 3 days, total', 'all'));
  days.forEach((d, i) => whenSel.append(new Option(`${d}${acc ? ', day total' : ', day max'}`, 'd' + i)));
  whenSel.value = day < 0 ? defaultWhen() : 'd' + day;
}

async function paintOverlay() {
  const seq = ++ov.seq, key = ov.field;
  if (!key) {
    if (map.getLayer('model')) map.setLayoutProperty('model', 'visibility', 'none');
    document.getElementById('legend').style.display = 'none';
    status.textContent = ''; ov.grid = null;
    return;
  }
  status.textContent = `Loading ${FIELDS[key].label}…`;
  try {
    const grid = await overlayGrid(key, whenSel.value);
    if (seq !== ov.seq) return;
    const cv = paint(grid, ov.man, key);
    const url = cv.toDataURL('image/png');
    const coords = [[BOX.w, BOX.n], [BOX.e, BOX.n], [BOX.e, BOX.s], [BOX.w, BOX.s]];
    if (map.getSource('model')) map.getSource('model').updateImage({ url, coordinates: coords });
    else {
      map.addSource('model', { type: 'image', url, coordinates: coords });
      map.addLayer({ id: 'model', type: 'raster', source: 'model', paint: { 'raster-opacity': +opInput.value, 'raster-fade-duration': 0 } }, 'areas-fill');
    }
    map.setLayoutProperty('model', 'visibility', 'visible');
    ov.grid = grid;
    legend(key);
    status.textContent = FIELDS[key].title + (FIELDS[key].unit ? ` (${FIELDS[key].unit})` : '');
  } catch (e) {
    if (seq === ov.seq) status.textContent = `${FIELDS[key].label}: ${e.message}`;
  }
}

function fieldButtons() {
  const wrap = document.getElementById('fields');
  const all = [['', 'Off'], ...Object.entries(FIELDS).map(([k, f]) => [k, f.label])];
  for (const [k, label] of all) {
    const b = document.createElement('button');
    b.textContent = label;
    b.setAttribute('aria-pressed', String((ov.field || '') === k));
    b.addEventListener('click', () => {
      ov.field = k || null;
      wrap.querySelectorAll('button').forEach((x, j) => x.setAttribute('aria-pressed', String(all[j][0] === k)));
      whenOptions();
      paintOverlay();
    });
    wrap.append(b);
  }
  if (!data?.dates) { document.getElementById('layers').style.display = 'none'; }
}
whenSel.addEventListener('change', paintOverlay);
opInput.addEventListener('input', () => { if (map.getLayer('model')) map.setPaintProperty('model', 'raster-opacity', +opInput.value); });

const probe = document.getElementById('probe');
map.on('mousemove', (e) => {
  if (!ov.grid || !ov.field) { probe.style.display = 'none'; return; }
  const F = FIELDS[ov.field], v = sample(ov.grid, ov.man, e.lngLat.lat, e.lngLat.lng) * F.k;
  if (!(v === v)) { probe.style.display = 'none'; return; }
  probe.textContent = `${F.label} ${v >= 100 ? Math.round(v) : v.toFixed(1)} ${F.unit}`;
  probe.style.left = e.point.x + 14 + 'px'; probe.style.top = e.point.y + 10 + 'px'; probe.style.display = 'block';
});
map.getCanvas().addEventListener('mouseleave', () => { probe.style.display = 'none'; });

addEventListener('hashchange', () => location.reload()); // another morning's link opened in this tab
list();
dayButtons();
fieldButtons();
// 'style.load', not 'load': 'load' waits for every basemap tile, terrain included, before the areas show.
map.once('style.load', () => {
  // Weather layers go under the basemap's labels: the style leaves an empty 'radar-slot' layer for that.
  map.addSource('areas', { type: 'geojson', data: geojson() });
  map.addLayer({ id: 'areas-fill', type: 'fill', source: 'areas', paint: { 'fill-color': ['get', 'c'], 'fill-opacity': ['get', 'o'] } }, 'radar-slot');
  map.addLayer({ id: 'areas-line', type: 'line', source: 'areas', filter: ['==', ['get', 'main'], 1],
    paint: { 'line-color': ['get', 'c'], 'line-opacity': 0.9, 'line-width': ['get', 'w'] } }, 'radar-slot');
  map.addLayer({ id: 'areas-line-minor', type: 'line', source: 'areas', filter: ['==', ['get', 'main'], 0],
    paint: { 'line-color': ['get', 'c'], 'line-opacity': 0.6, 'line-width': 1, 'line-dasharray': [2, 2] } }, 'radar-slot');
  map.on('click', 'areas-fill', (e) => show(items[e.features[0].properties.k], e.lngLat));
  map.on('mouseenter', 'areas-fill', () => { map.getCanvas().style.cursor = 'pointer'; });
  map.on('mouseleave', 'areas-fill', () => { map.getCanvas().style.cursor = ''; });
  draw();
  if (items.length) {
    const b = new maplibregl.LngLatBounds();
    items.forEach((it) => b.extend(bounds(it)));
    map.fitBounds(b, { padding: pad(), maxZoom: 6, duration: 0 });
  }
});
</script>
</body>
