<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Automated Severe Storm Outlook</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{ --bg:#acc4d6; --panel:rgba(255,255,255,.94); --border:#c4d0dd; --text:#1a2a3a; --muted:#5c6c7d; }
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;}
  #wrap{position:relative;height:100vh;width:100%;overflow:hidden;}
  #map{position:absolute;inset:0;background:var(--bg);}
  .leaflet-container{background:var(--bg);}
  #topbar{position:absolute;top:0;left:0;right:0;z-index:1000;display:flex;align-items:center;gap:10px;padding:11px 14px;flex-wrap:wrap;
    background:linear-gradient(180deg,rgba(240,245,250,.92),rgba(240,245,250,0));pointer-events:none;}
  #topbar .title{font-weight:800;font-size:15px;letter-spacing:.01em;pointer-events:auto;color:#152232;}
  #topbar .title small{display:block;font-weight:500;font-size:11px;color:var(--muted);margin-top:1px;}
  #days{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;pointer-events:auto;}
  .dbtn{background:rgba(255,255,255,.9);border:1px solid var(--border);color:var(--text);font-size:12px;font-weight:600;padding:6px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;transition:.15s;box-shadow:0 1px 4px rgba(20,40,70,.08);}
  .dbtn:hover{border-color:#7ea3d8;}
  .dbtn.active{background:#2563eb;border-color:#2563eb;color:#fff;box-shadow:0 2px 10px rgba(37,99,235,.35);}
  .dbtn small{display:block;font-weight:500;font-size:10px;opacity:.85;}
  #info{position:absolute;top:62px;left:14px;z-index:1000;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:11px 13px;max-width:240px;font-size:12px;line-height:1.45;backdrop-filter:blur(6px);pointer-events:none;box-shadow:0 4px 18px rgba(20,40,70,.18);}
  #info .cat{font-weight:700;font-size:13px;}
  #info .hint{color:var(--muted);} #info .sm{color:var(--muted);font-size:11px;margin-top:2px;}
  #legend{position:absolute;bottom:16px;right:14px;z-index:1000;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:11px 13px;font-size:11px;backdrop-filter:blur(6px);box-shadow:0 4px 18px rgba(20,40,70,.18);}
  #legend .cap{color:var(--muted);margin-bottom:6px;font-weight:600;text-transform:uppercase;font-size:10px;letter-spacing:.06em;}
  #legend .row{display:flex;align-items:center;gap:8px;margin:4px 0;} #legend .sw{width:18px;height:12px;border-radius:3px;border:1.5px solid rgba(20,40,70,.35);}
  #caption{position:absolute;bottom:16px;left:14px;z-index:1000;max-width:340px;font-size:11px;color:var(--muted);line-height:1.45;background:rgba(255,255,255,.8);padding:7px 9px;border-radius:8px;backdrop-filter:blur(4px);box-shadow:0 2px 10px rgba(20,40,70,.1);}
  #updated{color:var(--muted);font-size:10px;margin-top:3px;}
  #load{position:absolute;inset:0;z-index:2000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(172,196,214,.97);text-align:center;padding:24px;}
  #load .sp{width:34px;height:34px;border:4px solid var(--border);border-top-color:#2563eb;border-radius:50%;animation:spin 1s linear infinite;}
  #load .msg{font-size:13px;color:var(--muted);max-width:320px;} .err{color:#b02a2a;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .town{font-size:11px;font-weight:600;color:#15263a;text-shadow:0 0 3px #fff,0 0 3px #fff,0 1px 2px #fff;white-space:nowrap;}
  .town .dot{display:inline-block;width:3px;height:3px;border-radius:50%;background:#15263a;margin-right:3px;vertical-align:middle;box-shadow:0 0 2px #fff;}
  @media (max-width:640px){#info{max-width:180px;}#caption{max-width:200px;}#topbar .title small{display:none;}}
</style>
</head>
<body>
<div id="wrap">
  <div id="map"></div>
  <div id="topbar"><div class="title">Automated Severe Storm Outlook<small>Storm categories &middot; noon&ndash;6pm window</small></div><div id="days"></div></div>
  <div id="info"><span class="hint">Hover the map for storm risk at that spot.</span></div>
  <div id="legend"></div>
  <div id="caption">Automated guidance from forecast model data. Not an official warning &mdash; always check the Bureau of Meteorology.<div id="updated"></div></div>
  <div id="load"><div class="sp"></div><div class="msg" id="loadmsg">Loading outlook&hellip;</div></div>
</div>
<script>
(function(){
  "use strict";
  var STATES=null;
  var TOWNS=[
    {n:'Perth',lat:-31.95,lon:115.86},{n:'Adelaide',lat:-34.93,lon:138.60},{n:'Darwin',lat:-12.46,lon:130.84},
    {n:'Brisbane',lat:-27.47,lon:153.03},{n:'Sydney',lat:-33.87,lon:151.21},{n:'Melbourne',lat:-37.81,lon:144.96},
    {n:'Hobart',lat:-42.88,lon:147.33},{n:'Canberra',lat:-35.28,lon:149.13},{n:'Broome',lat:-17.96,lon:122.24},
    {n:'Port Hedland',lat:-20.31,lon:118.61},{n:'Karratha',lat:-20.74,lon:116.85},{n:'Geraldton',lat:-28.77,lon:114.61},
    {n:'Kalgoorlie',lat:-30.75,lon:121.47},{n:'Esperance',lat:-33.86,lon:121.89},{n:'Albany',lat:-35.02,lon:117.88},
    {n:'Alice Springs',lat:-23.70,lon:133.88},{n:'Katherine',lat:-14.46,lon:132.26},{n:'Tennant Creek',lat:-19.65,lon:134.19},
    {n:'Mount Isa',lat:-20.72,lon:139.49},{n:'Cairns',lat:-16.92,lon:145.77},{n:'Townsville',lat:-19.26,lon:146.82},
    {n:'Mackay',lat:-21.14,lon:149.19},{n:'Rockhampton',lat:-23.38,lon:150.51},{n:'Bundaberg',lat:-24.87,lon:152.35},
    {n:'Toowoomba',lat:-27.56,lon:151.95},{n:'Gold Coast',lat:-28.02,lon:153.40},{n:'Coffs Harbour',lat:-30.30,lon:153.12},
    {n:'Newcastle',lat:-32.93,lon:151.78},{n:'Wollongong',lat:-34.42,lon:150.89},{n:'Dubbo',lat:-32.24,lon:148.60},
    {n:'Wagga Wagga',lat:-35.11,lon:147.37},{n:'Mildura',lat:-34.19,lon:142.16},{n:'Bendigo',lat:-36.76,lon:144.28},
    {n:'Ballarat',lat:-37.56,lon:143.86},{n:'Launceston',lat:-41.43,lon:147.14},{n:'Broken Hill',lat:-31.95,lon:141.47},
    {n:'Port Augusta',lat:-32.49,lon:137.77},{n:'Ceduna',lat:-32.13,lon:133.70},{n:'Longreach',lat:-23.44,lon:144.25},
    {n:'Charleville',lat:-26.40,lon:146.24},{n:'Weipa',lat:-12.68,lon:141.87},{n:'Kununurra',lat:-15.77,lon:128.74},
    {n:'Port Lincoln',lat:-34.73,lon:135.86},{n:'Warrnambool',lat:-38.38,lon:142.48},{n:'Bourke',lat:-30.09,lon:145.94}
  ];
  var CAT=[{name:'—',color:null},{abbr:'',name:'Increased chance of storm activity',color:[150,205,150]},{abbr:'MRGL',name:'Marginal',color:[86,158,86]},{abbr:'SLGT',name:'Slight',color:[248,220,90]},{abbr:'ENH',name:'Enhanced',color:[247,158,84]},{abbr:'MDT',name:'Moderate',color:[224,96,96]},{abbr:'HIGH',name:'High',color:[236,140,236]}];
  var map=L.map('map',{zoomControl:true,attributionControl:false,minZoom:3,maxZoom:9,worldCopyJump:false,maxBounds:[[-46,108],[-8,157]],maxBoundsViscosity:0.7}).setView([-27.5,134],4);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png',{maxNativeZoom:13,detectRetina:true,opacity:1}).addTo(map);

  var GRID=[],results=[],DAYS=[],selDay=0,overlay=null,minLat,maxLat,minLon,maxLon,mYmin,mYmax,W,H;
  function mercY(la){return Math.log(Math.tan(Math.PI/4 + la*Math.PI/360));}
  function scanStates(){
    minLat=1e9;maxLat=-1e9;minLon=1e9;maxLon=-1e9;
    STATES.features.forEach(function(f){
      var polys=f.geometry.type==='Polygon'?[f.geometry.coordinates]:f.geometry.coordinates;
      polys.forEach(function(poly){poly[0].forEach(function(c){if(c[0]<minLon)minLon=c[0];if(c[0]>maxLon)maxLon=c[0];if(c[1]<minLat)minLat=c[1];if(c[1]>maxLat)maxLat=c[1];});});
    });
    minLat-=0.6;maxLat+=0.6;minLon-=0.6;maxLon+=0.6;
    mYmin=mercY(minLat);mYmax=mercY(maxLat);
  }
  function lonToX(lo){return (lo-minLon)/(maxLon-minLon)*W;} function latToY(la){return (mYmax-mercY(la))/(mYmax-mYmin)*H;}

  function boxBlur(a,w,h,r){
    var tmp=new Float32Array(w*h);
    for(var y=0;y<h;y++){var s=0,c=0;for(var x=-r;x<w;x++){if(x+r<w){s+=a[y*w+x+r];c++;}if(x-r-1>=0){s-=a[y*w+x-r-1];c--;}if(x>=0)tmp[y*w+x]=s/c;}}
    for(var x2=0;x2<w;x2++){var s2=0,c2=0;for(var y2=-r;y2<h;y2++){if(y2+r<h){s2+=tmp[(y2+r)*w+x2];c2++;}if(y2-r-1>=0){s2-=tmp[(y2-r-1)*w+x2];c2--;}if(y2>=0)a[y2*w+x2]=s2/c2;}}
  }
  function buildSurface(){
    var sx=[],sy=[],sc=[],sh=[];
    for(var i=0;i<GRID.length;i++){var r=results[i]?results[i][selDay]:null;if(!r)continue;
      sx.push(lonToX(GRID[i][1]));sy.push(latToY(GRID[i][0]));sc.push(r.cat);sh.push(r.hatch);}
    var cv=document.createElement('canvas');cv.width=W;cv.height=H;var ctx=cv.getContext('2d');
    if(sx.length<3)return cv;
    var val=new Float32Array(W*H),htv=new Float32Array(W*H),P=2.6;
    for(var y=0;y<H;y++){for(var x=0;x<W;x++){
      var num=0,den=0,hn=0;
      for(var i2=0;i2<sx.length;i2++){var dx=x-sx[i2],dy=y-sy[i2],d2=dx*dx+dy*dy;var w=1/Math.pow(d2+1,P/2);num+=w*sc[i2];den+=w;hn+=w*sh[i2];}
      var idx=y*W+x; val[idx]=num/den; htv[idx]=hn/den;
    }}
    boxBlur(val,W,H,3); boxBlur(htv,W,H,3);
    var catR=new Int16Array(W*H);
    for(var p0=0;p0<W*H;p0++){var c0=Math.round(val[p0]);if(c0<0)c0=0;if(c0>6)c0=6;catR[p0]=c0;}
    var img=ctx.createImageData(W,H),d=img.data;
    // fill bands
    for(var p=0;p<W*H;p++){
      var cat=catR[p]; if(cat<1){continue;}
      var col=CAT[cat].color; var rr=col[0],gg=col[1],bb=col[2];
      var xx=p%W, yy=(p/W)|0;
      if(htv[p]>0.45 && cat>=2 && ((xx+yy)%9)<2){rr=40;gg=40;bb=40;}
      var o=p*4; d[o]=rr;d[o+1]=gg;d[o+2]=bb;d[o+3]=200;
    }
    // outline every band (contour lines)
    for(var yy2=0;yy2<H;yy2++){for(var xx2=0;xx2<W;xx2++){
      var pp=yy2*W+xx2, cc=catR[pp]; if(cc<1)continue;
      var edge=(xx2+1<W&&catR[pp+1]<cc)||(xx2>0&&catR[pp-1]<cc)||(yy2+1<H&&catR[pp+W]<cc)||(yy2>0&&catR[pp-W]<cc);
      if(edge){var col2=CAT[cc].color;var er=Math.round(col2[0]*0.4),eg=Math.round(col2[1]*0.4),eb=Math.round(col2[2]*0.4);
        var q=pp*4; d[q]=er;d[q+1]=eg;d[q+2]=eb;d[q+3]=255;
        if(yy2+1<H){var q2=(pp+W)*4;d[q2]=er;d[q2+1]=eg;d[q2+2]=eb;d[q2+3]=255;}
      }
    }}
    ctx.putImageData(img,0,0);
    // clip to land (union of states) for a clean coastline
    ctx.globalCompositeOperation='destination-in';
    ctx.beginPath();
    STATES.features.forEach(function(f){
      var polys=f.geometry.type==='Polygon'?[f.geometry.coordinates]:f.geometry.coordinates;
      polys.forEach(function(poly){var ring=poly[0];for(var j=0;j<ring.length;j++){var px=lonToX(ring[j][0]),py=latToY(ring[j][1]);if(j===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);}ctx.closePath();});
    });
    ctx.fill(); ctx.globalCompositeOperation='source-over';
    return cv;
  }
  function renderSurface(){var url=buildSurface().toDataURL('image/png');var b=[[minLat,minLon],[maxLat,maxLon]];
    if(overlay)overlay.setUrl(url);else{overlay=L.imageOverlay(url,b,{opacity:0.92,interactive:false}).addTo(map);}}
  map.on('mousemove',function(e){
    if(!results.length)return;var la=e.latlng.lat,lo=e.latlng.lng,best=-1,bd=1e9;
    for(var i=0;i<GRID.length;i++){var dd=(GRID[i][0]-la)*(GRID[i][0]-la)+(GRID[i][1]-lo)*(GRID[i][1]-lo);if(dd<bd){bd=dd;best=i;}}
    var box=document.getElementById('info');
    if(best<0||bd>4||!results[best]){box.innerHTML='<span class="hint">No data here.</span>';return;}
    var r=results[best][selDay],c=CAT[r.cat],col=c.color?('rgb('+c.color[0]+','+c.color[1]+','+c.color[2]+')'):'#5c6c7d';
    box.innerHTML='<div class="cat" style="color:'+col+'">'+(r.cat===0?'No storms':(c.abbr?c.abbr+' · ':'')+c.name)+(r.hatch&&r.cat>=2?' (sig)':'')+'</div>'+
      'CAPE '+Math.round(r.cape)+' J/kg · Shear '+Math.round(r.shear)+' kt<div class="sm">SCP '+r.scp+' · STP '+r.stp+' · SHIP '+r.ship+'</div>';
  });
  function buildLegend(){var h='<div class="cap">Storm risk</div>';for(var k=6;k>=1;k--){var c=CAT[k];h+='<div class="row"><span class="sw" style="background:rgb('+c.color[0]+','+c.color[1]+','+c.color[2]+')"></span>'+(c.abbr?c.abbr+' — ':'')+c.name+'</div>';}
    h+='<div class="row"><span class="sw" style="background:repeating-linear-gradient(45deg,#333,#333 2px,transparent 2px,transparent 5px),#e06060"></span>Hatched — significant</div>';document.getElementById('legend').innerHTML=h;}
  function buildDayButtons(){var wrap=document.getElementById('days');wrap.innerHTML='';DAYS.forEach(function(lbl,i){var b=document.createElement('button');b.className='dbtn'+(i===selDay?' active':'');b.innerHTML='Day '+(i+1)+'<small>'+lbl+'</small>';b.onclick=function(){selDay=i;[].forEach.call(wrap.children,function(c){c.classList.remove('active');});b.classList.add('active');renderSurface();};wrap.appendChild(b);});}
  function setErr(m){document.getElementById('loadmsg').innerHTML='<span class="err">'+m+'</span>';}

  Promise.all([
    fetch('./states.geo.json').then(function(r){return r.json();}),
    fetch('./outlook.json?_='+Date.now()).then(function(r){if(!r.ok)throw new Error('no outlook.json');return r.json();})
  ]).then(function(res){
    STATES=res[0]; var o=res[1];
    TOWNS.forEach(function(t){L.marker([t.lat,t.lon],{interactive:false,icon:L.divIcon({className:'',html:'<div class="town"><span class="dot"></span>'+t.n+'</div>',iconSize:[0,0]})}).addTo(map);});
    DAYS=o.days||['Day 1','Day 2','Day 3','Day 4'];
    o.points.forEach(function(p){GRID.push([p.lat,p.lon]);results.push(p.d);});
    scanStates();
    W=1200;H=Math.round(W*(mYmax-mYmin)/((maxLon-minLon)*Math.PI/180));
    buildLegend();buildDayButtons();renderSurface();
    document.getElementById('updated').textContent='Updated '+(o.run_date?new Date(o.run_date).toLocaleString('en-AU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'—');
    document.getElementById('load').style.display='none';
  }).catch(function(){setErr('No outlook yet. Run the GitHub Action once, then reload.');});
})();
</script>
</body>
</html>
