name: Daily storm outlook

# Runs once a day (07:00 UTC ≈ afternoon in Australia, after the 00Z GFS is in),
# and can be run manually from the Actions tab.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # allow the job to commit the new outlook.json

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-thunder-${{ runner.os }}

      - name: Install R packages
        run: Rscript -e 'install.packages(c("thunder","jsonlite"), repos="https://cloud.r-project.org")'

      - name: Build outlook
        run: Rscript pipeline/build_outlook.R

      - name: Commit result
        run: |
          git config user.name  "outlook-bot"
          git config user.email "actions@github.com"
          git add docs/outlook.json
          git commit -m "Update outlook $(date -u +%Y-%m-%d)" || echo "no change"
          git push
