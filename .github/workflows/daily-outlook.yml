name: Daily storm outlook

# Runs once a day at 19:52 UTC (03:52 AWST / 05:52 AEST), with a backup slot at 20:22, so the
# outlook is published around 4am Perth time. Can be run manually from the Actions tab.
on:
  schedule:
    # MOVED OFF THE HOUR, 29 Sep 2026. "0 18" (on the hour, GitHub's busiest moment) was starting
    # 2h14m-3h38m late every night from 20-27 Sep, and on 28 Sep was never delivered at all. Odd
    # minutes are picked up far faster.
    # TIMED FOR FRESH 12Z DATA, same day (Josh: "4am AWST"). Open-Meteo publishes each model run
    # ~7-8 h after it starts: the 12Z runs land at ~19:06 UTC (GFS) and ~19:45 UTC (ECMWF). A run
    # before then builds from the 06Z cycle, and ECMWF's 06Z run only reaches day 3.75, so days 4-8
    # would come from a run 17 h old. 19:52 is the first slot after both. The backup at 20:22
    # stands down via the gate job below if the first one already published.
    - cron: "52 19 * * *"
    - cron: "22 20 * * *"
  workflow_dispatch: {}

# One run at a time: a late-delivered schedule waits for a run in progress instead of overlapping
# it, and then finds a fresh outlook and skips.
concurrency:
  group: daily-outlook
  cancel-in-progress: false

permissions:
  contents: write   # allow the job to commit the new outlook.json

jobs:
  gate:
    # A SCHEDULED run skips itself when an outlook under 8 hours old is already published: that
    # covers the backup slot after a successful first slot, and a schedule GitHub delivers hours
    # late after a manual run. Manual and watchdog runs (workflow_dispatch) always build. Reads the
    # live outlook from origin/main at run time, not from the event's commit, which can be stale.
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.fresh.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: fresh
        run: |
          git fetch -q --depth=1 origin main
          AGE_H=$(git show FETCH_HEAD:docs/outlook.json | python3 -c "import json,sys,datetime as d; t=d.datetime.fromisoformat(json.load(sys.stdin)['run_date'].replace('Z','+00:00')); print(int((d.datetime.now(d.timezone.utc)-t).total_seconds()//3600))")
          echo "Live outlook is ${AGE_H}h old; triggered by ${{ github.event_name }}."
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$AGE_H" -lt 8 ]; then
            echo "A fresh outlook is already published -- skipping this scheduled run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true   # install precompiled Ubuntu binaries (fast, reliable)

      - name: Check pipeline parses
        # Rscript runs a file one top-level expression at a time, so a syntax error only
        # surfaces when execution reaches it: anything after the main fetch (the ECMWF pass,
        # retries, writing the outlook, verification) would fail only after ~10 minutes and
        # ~28,000 API calls, with nothing published. Parsing the whole file first catches it
        # in seconds, with the line number. Base R only, so it runs before the package install.
        run: Rscript -e 'invisible(parse("pipeline/build_outlook.R")); cat("pipeline/build_outlook.R parses\n")'

      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R packages
        run: Rscript -e 'install.packages(c("thunder","jsonlite")); if (!requireNamespace("thunder", quietly=TRUE)) stop("thunder failed to install")'

      - name: Build outlook
        env:
          OPENMETEO_KEY: ${{ secrets.OPENMETEO_KEY }}
        run: Rscript pipeline/build_outlook.R

      - name: Commit result
        # Build outlook can take anywhere from ~10 minutes to several hours depending on
        # Open-Meteo's response times, so main may have moved on by the time we're ready to
        # push (this has caused real same-day push failures). Rebase onto the latest main and
        # retry instead of assuming a clean fast-forward -- this job only ever touches
        # docs/outlook.json and docs/archive/ (the rolling run history + its index, written by
        # build_outlook.R), so a rebase has nothing else to conflict with.
        run: |
          git config user.name  "outlook-bot"
          git config user.email "actions@github.com"
          git add docs/outlook.json docs/archive
          git commit -m "Update outlook $(date -u +%Y-%m-%d)" || echo "no change"
          for i in 1 2 3 4 5; do
            git push && break
            echo "push rejected (attempt $i/5) -- rebasing onto latest main and retrying"
            git fetch origin main
            git rebase origin/main
            if [ "$i" -eq 5 ]; then
              echo "::error::push still failing after 5 rebase attempts"
              exit 1
            fi
          done
