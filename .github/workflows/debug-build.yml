name: Debug build (parallel test)

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R packages
        run: Rscript -e 'install.packages(c("thunder","jsonlite")); if (!requireNamespace("thunder", quietly=TRUE)) stop("thunder failed to install")'

      - name: Debug build (20 points, parallel)
        run: Rscript pipeline/debug_build_parallel.R
