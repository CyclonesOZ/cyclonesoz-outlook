name: Alert scan

# Step 1 of the postcode-alert system (shadow mode). After the nightly model run finishes, check the
# RAW run against alerts/thresholds.json and email the forecaster. Publishes nothing to subscribers.
# Runs whether the nightly run succeeded or failed, so a failed run produces a warning email
# (pipeline/alert_scan.py refuses to scan a stale run) instead of silence.
# It also sends Josh the morning 3-day severe email (pipeline/morning_email.py) through Resend,
# once per Perth date, as soon as the ~3:52 am AWST run lands.
on:
  workflow_run:
    workflows: ["Daily storm outlook"]
    types: [completed]
  workflow_dispatch:
    inputs:
      morning_test:
        description: "Only the 3-day severe email, from the latest run: print it, and email it if RESEND_API_KEY is set. Writes no state."
        type: boolean
        default: false

concurrency:
  group: alert-scan
  cancel-in-progress: false

permissions:
  contents: write   # commit docs/archive/alerts/ (what the forecaster was last told)

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30   # the morning email waits up to 15 min for the 0.25 deg model run
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # The morning email's outlines and refined wind/hail/rain read our own ECMWF grids
      # (pipeline/fine_grid.py, fine_areas.py), which need these. Without them it falls back to the boxes.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages
        run: python3 -m pip install --quiet numpy==2.2.6 scipy==1.15.3 pillow==11.3.0 contourpy==1.3.2

      - name: Run tests
        run: python3 pipeline/test_alert_scan.py && python3 pipeline/test_extra_hazards.py && python3 pipeline/test_proposals.py && python3 pipeline/test_morning_email.py && python3 pipeline/test_fine_areas.py

      - name: Scan and email
        env:
          OPENMETEO_KEY: ${{ secrets.OPENMETEO_KEY }}
          ALERT_SMTP_HOST: ${{ secrets.ALERT_SMTP_HOST }}
          ALERT_SMTP_PORT: ${{ secrets.ALERT_SMTP_PORT }}
          ALERT_SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}
          ALERT_SMTP_PASS: ${{ secrets.ALERT_SMTP_PASS }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # read-only key for the model viewer's paid frames (models.cyclonesoz.com); sent as a header, never printed
          MODEL_GATE_KEY: ${{ secrets.MODEL_GATE_KEY }}
          MODEL_CACHE_DIR: ${{ runner.temp }}/models
        run: |
          if [ "${{ inputs.morning_test }}" = "true" ]; then
            python3 pipeline/alert_scan.py --morning-only --send
          else
            python3 pipeline/alert_scan.py
          fi

      - name: Commit alert state
        if: ${{ inputs.morning_test != true }}
        run: |
          git config user.name  "outlook-bot"
          git config user.email "actions@github.com"
          git add docs/archive/alerts
          git commit -m "Alert scan state $(date -u +%Y-%m-%d)" || echo "no change"
          for i in 1 2 3 4 5; do
            git push && break
            echo "push rejected (attempt $i/5) -- rebasing onto latest main and retrying"
            git fetch origin main
            git rebase origin/main
            if [ "$i" -eq 5 ]; then
              echo "::error::push still failing after 5 rebase attempts"
              exit 1
            fi
          done
